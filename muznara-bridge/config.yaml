# Muznara Köprüsü (ADR-0140). The image is built from a private source repo and
# published, multi-arch and cosign-signed, at ghcr.io/narthelix/muznara-bridge.
name: Muznara Köprüsü
version: "1.3.0"
slug: muznara_bridge
description: Home Assistant'ı internete açmadan Muznara'ya bağlar
url: https://github.com/narthelix/muznara-ha-addons/tree/main/muznara-bridge
arch:
  - aarch64
  - amd64
image: ghcr.io/narthelix/muznara-bridge
init: false
startup: application
boot: auto
# Talks to Home Assistant locally through the Supervisor (no token typed).
homeassistant_api: true
# The lowest Supervisor role: the bridge needs nothing of the Supervisor itself.
hassio_role: default
# The pairing page (QR + code) and the bridge's state, inside HA's sidebar.
ingress: true
ingress_port: 8099
panel_icon: mdi:bridge
panel_title: Muznara Köprüsü
options:
  name: Muznara Köprüsü
schema:
  name: str
